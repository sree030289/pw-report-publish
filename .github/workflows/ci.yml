name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm test

  # Runs the example suite and publishes its report with this action (dogfooding).
  demo:
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    concurrency: { group: pages-publish, cancel-in-progress: false }
    defaults:
      run: { working-directory: example }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: ./
        if: ${{ !cancelled() }}
        with:
          report-dir: example/playwright-report
          results-json: example/results.json
